# Tiny Tapeout project information
project:
  title:        "ALU de 8 bits con acumulador"
  author:       "JAIME ZAMORA"
  discord:      ""
  description:  "ALU de 8 bits con acumulador: carga, suma, suma con acarreo, NOT, AND, OR, XOR y desplazamientos"
  language:     "Verilog"
  clock_hz:     10000000

  tiles: "1x1"

  top_module:  "tt_um_alu_jzamora"

  source_files:
    - "project.v"

pinout:
  # Inputs
  ui[0]: "PORT_A[0]"
  ui[1]: "PORT_A[1]"
  ui[2]: "PORT_A[2]"
  ui[3]: "PORT_A[3]"
  ui[4]: "PORT_A[4]"
  ui[5]: "PORT_A[5]"
  ui[6]: "PORT_A[6]"
  ui[7]: "PORT_A[7]"

  # Outputs
  uo[0]: "ACC[0]"
  uo[1]: "ACC[1]"
  uo[2]: "ACC[2]"
  uo[3]: "ACC[3]"
  uo[4]: "ACC[4]"
  uo[5]: "ACC[5]"
  uo[6]: "ACC[6]"
  uo[7]: "ACC[7]"

  # Bidirectional pins
  uio[0]: "S0 (entrada)"
  uio[1]: "S1 (entrada)"
  uio[2]: "S2 (entrada)"
  uio[3]: "S3 (entrada)"
  uio[4]: "CIN (entrada)"
  uio[5]: "COUT (salida)"
  uio[6]: "Z (salida)"
  uio[7]: ""

# Do not change!
yaml_version: 6
